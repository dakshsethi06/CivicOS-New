# Alembic runs the SQL migrations in supabase/migrations, one revision per file, and records which have been applied.
#   alembic upgrade head          apply everything not yet applied (DATABASE_URL from apps/api/.env)
#   alembic current               show what the database has
#   alembic stamp 0018            mark a database that was set up by hand (SQL Editor) as being at a revision
#   python migrations/sync_sql.py create revisions for new SQL files
[alembic]
script_location = migrations
prepend_sys_path = .

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
